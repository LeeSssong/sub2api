<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=448,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="${csp}"><title>星桥降智检测 · 公开快照</title><style>${css}</style></head><body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></symbol>
<symbol id="i-group" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v2"/></symbol>
<symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.65 3.58 3 8 3s8-1.35 8-3V5M4 12c0 1.65 3.58 3 8 3s8-1.35 8-3"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 16-5-5L6 21"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20v-6m5 6v-9m5 9v-5m5 5V7M3 9l6-5 5 4 7-6"/></symbol>
<symbol id="i-bird" viewBox="0 0 24 24"><path d="M3 20 8 8a6 6 0 0 1 11 1l3 3h-5c-1 6-7 8-13 8m4-1 4-8m-1 8 2 3M7 19l-2 3"/><circle cx="15" cy="7" r=".6"/></symbol>
<symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3v3c0 3 10 9 10 12v3M17 3v3c0 3-10 9-10 12v3M8 6h8M8 18h8"/></symbol>
</defs></svg>
<article class="report" id="report" aria-label="星桥降智检测公开快照">
<header class="header"><div class="brand"><img src="${logo}" alt="星桥"><h1>星桥降智检测</h1></div><div class="timestamp"><svg class="icon"><use href="#i-clock"/></svg><span>获取 ${fetched_at} · 北京时间</span></div><span class="tagline"><svg class="icon"><use href="#i-star"/></svg>让 AI 更可靠</span></header>
<section class="meta" aria-label="分组与最近作品模型"><div class="meta-line first"><svg class="icon"><use href="#i-group"/></svg><span class="meta-label">分组</span><span class="meta-value">${group_name}</span></div><div class="meta-line second"><svg class="icon"><use href="#i-database"/></svg><span class="meta-label">模型</span><span class="meta-value">${model}</span></div></section>
<section class="checks" aria-label="公开数据状态"><div class="check-row"><span class="check-icon"><svg class="icon"><use href="#i-bird"/></svg></span><span class="check-label">鹈鹕作品</span><span class="badge ${artwork_class}">${artwork_label}</span></div><div class="check-row"><span class="check-icon"><svg class="icon"><use href="#i-chart"/></svg></span><span class="check-label">区间统计</span><span class="badge ${stats_class}">${stats_label}</span></div><p class="check-note">推理强度 ${effort} · 公开快照</p></section>
<figure class="artwork">${thumbnail}<figcaption><svg class="icon"><use href="#i-image"/></svg>最近公开作品</figcaption></figure>
<div class="divider"></div><div class="history-head"><span class="history-title"><svg class="icon"><use href="#i-chart"/></svg>鹈鹕生成统计</span><span class="history-window">所选分组 · 公开数据</span></div>
<section class="history-panel statistics" aria-label="所选分组鹈鹕生成汇总"><div class="history-line"><span class="history-label"><svg class="icon"><use href="#i-bird"/></svg>生成结果</span><span class="history-result"><span class="count">${count}</span><strong class="percentage">${rate}</strong></span></div>${bar}<div class="history-note">${note}</div></section>
<section class="history-panel coverage" aria-label="公开统计区间与覆盖状态"><div class="coverage-caption"><svg class="icon"><use href="#i-clock"/></svg>统计区间 · 北京时间</div><div class="period">${period}</div><div class="history-note">${coverage}</div></section>
<footer class="footer"><div class="footer-group"><span class="footer-icon"><svg class="icon"><use href="#i-clock"/></svg></span><div><div class="footer-label">作品记录时间</div><div class="footer-value">${generated_at}</div></div></div><div class="footer-group end"><span class="footer-icon"><svg class="icon"><use href="#i-hourglass"/></svg></span><div><div class="footer-label">生成耗时</div><div class="footer-value">${duration}</div></div></div></footer>
</article></body></html>
